  <style>
/*GAME*/

#game-container {
    width: min(640px, 100%);

    margin: 0 auto;

    display: flex;
    flex-direction: column;
    align-items: center;

    position: relative;

    padding: 8px;
}


/*ENEMY*/

#enemy-area {
  position: relative; /* Allows absolute positioning for touch overlay */
  width: 100%;
  height: 200px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin-bottom: 10px;
}

#enemy-canvas {
    width: 120px;
    height: 120px;
    display: block;
}



/* CANVAS*/

#arena {
    width: 100%;
    max-width: 380px;

    height: auto;

    background-color: #000;

    border: 5px solid #fff;

    display: block;
}


/*HUD*/

#player-hud {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    margin: 15px 0;

    padding: 0 10px;

    font-weight: bold;

    font-size: clamp(14px, 3vw, 20px);
}

#hp-bar-container {
    display: flex;
    align-items: center;

    gap: 10px;

    min-width: 0;
}

#hp-bar-background {
    width: clamp(70px, 20vw, 120px);
    height: clamp(14px, 4vw, 20px);

    background-color: #c30000;
}

#hp-bar-fill {
    width: 100%;
    height: 100%;

    background-color: #ffff00;

    transition: width 0.2s ease;
}


/*BUTTONS */

#action-buttons {
    width: 100%;

    display: flex;

    gap: clamp(5px, 2vw, 10px);
}

.btn {
    flex: 1;
    min-width: 0;

    padding: clamp(8px, 2vw, 12px) 0;

    background-color: #000;

    border: 3px solid #ff7f00;

    color: #ff7f00;

    font-family: 'Courier New', Courier, monospace;

    font-size: clamp(14px, 4vw, 20px);

    font-weight: bold;

    text-align: center;

    cursor: pointer;

    touch-action: manipulation;
}

.btn:hover {
    color: #ffff00;
    border-color: #ffff00;
}

.btn:active {
    transform: scale(0.98);
}


/*GAME OVER*/

#game-over-screen {
    position: absolute;

    inset: 0;

    background-color: rgba(0, 0, 0, 0.95);

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    z-index: 100;
}

#game-over-screen h1 {
    color: #ff0000;

    font-size: clamp(32px, 10vw, 48px);

    margin-bottom: 20px;

    text-align: center;
}

#game-over-screen button {
    padding: 10px 20px;

    font-size: clamp(14px, 4vw, 18px);

    font-family: 'Courier New', Courier, monospace;

    background-color: #000;
    color: #fff;

    border: 2px solid #fff;

    cursor: pointer;

    touch-action: manipulation;
}


/* UTILITY*/

.hidden {
    display: none !important;
}

/* OVERLAY CONTAINER OVER THE ENEMY AREA */
#mobile-controls {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  padding: 10px;
  justify-content: space-between;
  align-items: center;
  pointer-events: none; /* Passes clicks through empty spaces */
  z-index: 10;
}

/* Enable pointer events on active buttons */
#mobile-controls .touch-btn {
  pointer-events: auto;
}

/* Show touch controls on touch screens */
@media (pointer: coarse), (hover: none) {
  #mobile-controls:not(.hidden) {
    display: flex;
  }
}

/* Base Semi-Transparent Touch Controls */
.touch-btn {
  background-color: rgba(17, 17, 17, 0.75); /* Semi-transparent background */
  color: #fff;
  border: 2px solid rgba(255, 255, 255, 0.8);
  border-radius: 8px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 16px;
  font-weight: bold;
  touch-action: manipulation;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(2px); /* Sleek backdrop effect */
  transition: transform 0.05s ease, background-color 0.1s ease;
}

/* Button Active Press Effect */
.touch-btn:active, .touch-btn.active {
  transform: scale(0.92);
  background-color: rgba(255, 127, 0, 0.9);
  color: #000;
  border-color: #ffff00;
}

/* Layout Adjustments for Left/Right Positioning */
#dpad-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.dpad-middle {
  display: flex;
  gap: 3px;
}

.dpad-up, .dpad-down, .dpad-left, .dpad-right, .dpad-center {
  width: 42px;
  height: 42px;
}

.dpad-center {
  border: none;
  background: transparent;
  backdrop-filter: none;
}

#action-touch-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 120px;
}

.action-btn {
  width: 100%;
  padding: 10px 0;
  font-size: 13px;
}

.confirm {
  border-color: rgba(0, 255, 0, 0.8);
  color: #00ff00;
  background-color: rgba(0, 40, 0, 0.65);
}

.cancel {
  border-color: rgba(255, 0, 0, 0.8);
  color: #ff4444;
  background-color: rgba(40, 0, 0, 0.65);
}

#attack-touch-container {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
}

.strike-btn {
  width: 80%;
  padding: 14px 0;
  font-size: 20px;
  border-color: #00ff00;
  color: #00ff00;
  background-color: rgba(0, 50, 0, 0.85);
}

  </style>
