<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Battle Arena</title>
  <link rel="stylesheet" href="./../style.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>


  @import url('https://fonts.googleapis.com/css2?family=Jersey+15&display=swap');

* {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

/* Page Flex Layout prevents overlapping elements */
body {
  background-color: #0d0d0d;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  font-family: sans-serif;
  overflow: hidden;
}

/* Navbar stays locked strictly at top */
.navbar {
  width: 100%;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background-color: #111;
  color: #fff;
  flex-shrink: 0;
  z-index: 20;
}

.nav-brand {
  font-family: "Jersey 15", sans-serif;
  font-size: 1.5rem;
  color: yellow;
}

.nav-links {
  display: flex;
  gap: 12px;
  list-style: none;
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
}

/* Container centers game canvas below the navbar */
.container {
  flex: 1;
  width: 100%;
  max-width: 1024px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  min-height: 0;
}

/* Aspect-ratio restricted game box */
.game-wrapper {
  position: relative;
  width: 100%;
  max-height: 100%;
  aspect-ratio: 16 / 9;
  border: 2px solid white;
  border-radius: 8px;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Healthbar Overlay (Positioned inside game border) */
.healthbar {
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  width: 100%;
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}

.bar-container {
  position: relative;
  height: 24px;
  width: 100%;
  border: 2px solid #fff;
  background-color: red;
}

.playerbar, .enemybar {
  background-color: red;
  width: 100%;
  height: 100%;
}

#playerhealth {
  position: absolute;
  background-color: yellow;
  top: 0;
  right: 0;
  bottom: 0;
  width: 100%;
}

#enemyhealth {
  position: absolute;
  background-color: blue;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
}

.timer {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
  background-color: rgba(0, 0, 0, 0.75);
  border: 2px solid yellow;
  color: yellow;
  font-family: "Jersey 15", sans-serif;
  font-size: clamp(1rem, 3vh, 1.8rem);
  width: clamp(32px, 6vh, 46px);
  height: clamp(32px, 6vh, 46px);
  margin: 0 10px;
}

#endscreen {
  display: none;
  justify-content: center;
  align-items: center;
  position: absolute;
  z-index: 15;
  color: rgb(0, 242, 255);
  font-family: "Jersey 15", sans-serif;
  font-size: clamp(2.5rem, 8vw, 5rem);
  inset: 0;
  background-color: rgba(0, 0, 0, 0.5);
  text-align: center;
}

/* Touch Control Overlay */
.controls {
  position: absolute;
  bottom: 8px;
  left: 0;
  right: 0;
  z-index: 12;
  display: flex;
  justify-content: space-between;
  width: 100%;
  padding: 0 10px;
  pointer-events: none;
}

.controls-group {
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  pointer-events: auto;
}

button {
  width: clamp(34px, 8.5vh, 48px);
  height: clamp(34px, 8.5vh, 48px);
  font-size: clamp(11px, 2vh, 15px);
  font-weight: bold;
  user-select: none;
  touch-action: manipulation;
  cursor: pointer;
  border-radius: 6px;
  border: 2px solid rgba(255, 255, 255, 0.85);
  background: rgba(0, 0, 0, 0.65);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

button:active {
  background: rgba(255, 255, 255, 0.4);
}

@media (min-width: 1025px) and (hover: hover) {
  .controls {
    display: none;
  }
}
</style>
</head>
<body>
  <!-- Fixed Navbar -->
  <nav class="navbar">
    <div class="Home"><a href="./../index.html"><h1>🏠︎</h1></a></div>
    <div class="nav-brand">FIGHTER ARENA</div>
    <ul class="nav-links">
      <li><a href="#arena">Game1</a></li>
      <li><a href="./../Game2/game2.html">Game2</a></li>
      <li><a href="javascript:void(0);" onclick="window.location.reload();">Reset</a></li>
    </ul>
  </nav>

  <audio id="bg-music" autoplay loop>
  <source src="./../Assets/Audios/game1bg.mp3" type="audio/mpeg">
</audio>


 <div id="controls-overlay" class="overlay">
  <div class="overlay-content">
    <h2>Game Controls</h2>
    <table class="controls-table">
      <thead>
        <tr>
          <th>Action</th>
          <th class="p1-header">Player 1</th>
          <th class="p2-header">Player 2</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Left</td>
          <td><kbd>A</kbd></td>
          <td><kbd>←</kbd></td>
        </tr>
        <tr>
          <td>Right</td>
          <td><kbd>D</kbd></td>
          <td><kbd>→</kbd></td>
        </tr>
        <tr>
          <td>Jump</td>
          <td><kbd>W</kbd></td>
          <td><kbd>↑</kbd></td>
        </tr>
        <tr>
          <td>Attack</td>
          <td><kbd>S</kbd></td>
          <td><kbd>↓</kbd></td>
        </tr>
      </tbody>
    </table>
    <p class="start-prompt">Click or Tap anywhere to Start</p>
  </div>
</div>

  <!-- Game Container -->
  <div class="container">
    <div class="game-wrapper">
      
      <!-- Visible Healthbar Overlay -->
      <div class="healthbar">
        <!-- Player Health Bar -->
        <div class="bar-container">
          <div class="playerbar"></div>
          <div id="playerhealth"></div>
        </div>

        <!-- Timer -->
        <div class="timer" id="timer">60</div>

        <!-- Enemy Health Bar -->
        <div class="bar-container">
          <div class="enemybar"></div>
          <div id="enemyhealth"></div>
        </div>
      </div>

      <div id="endscreen">Tie</div>
      <canvas></canvas>

      <!-- On-Screen Controls -->
      <div class="controls">
        <div class="controls-group">
          <button id="p-left">A</button>
          <button id="p-jump">W</button>
          <button id="p-right">D</button>
          <button id="p-attack" style="background-color: #a00;">ATK</button>
        </div>

        <div class="controls-group">
          <button id="e-attack" style="background-color: #00a;">ATK</button>
          <button id="e-left">←</button>
          <button id="e-jump">↑</button>
          <button id="e-right">→</button>
        </div>
      </div>

    </div>
  </div>

  <script src="./../JS/utils.js"></script>
  <script src="./../JS/classes.js"></script>
  <script src="./game.js"></script>
</body>
</html>
