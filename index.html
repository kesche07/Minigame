<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Small Minigame</title>
  <link rel="stylesheet" href="./style.css">
  <STYLE>
    .navbar {
  font-family:"Jersey 15", sans-serif;
  width: 100%;
  background-color: #111;
  border-bottom: 2px solid #fff;
  display: flex;
  justify-content:flex-start;
  align-items:center;
  padding: 10px 30px;
  position: fixed;
  z-index: 100;
}
.grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Grid Cards / Links */
    .grid-item {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 150px;
      background-color: #ffffff;
      color: #333333;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
      border: 2px solid #dddddd;
      border-radius: 8px;
      transition: transform 0.2s, border-color 0.2s;
    }

    /* Hover effect for basic feedback */
    .grid-item:hover {
      transform: translateY(-4px);
      border-color: #007bff;
      color: #007bff;
    }

  </STYLE>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="Home"><a href="#"><h1>🏠︎</h1></a></div>
    <div class="nav-brand">ARCADE GAMES</div>
  </nav>

  <div class="grid-container">
    <a href="./game.html" class="grid-item">Game 1</a>
    <a href="./game2.html" class="grid-item">Game2 </a>
    <a href="./about.html" class="grid-item">About & Contact</a>
    
  </div>

 
  <script src="./JS/utils.js"></script>
  <script src="./JS/classes.js"></script>
  <script src="./game.js"></script>
</body>
</html>
